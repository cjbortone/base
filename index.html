<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#000000">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<title>BASE</title>
<link rel="apple-touch-icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 180 180'%3E%3Crect width='180' height='180' fill='%23000'/%3E%3Ctext x='90' y='118' font-family='-apple-system,Helvetica,sans-serif' font-size='58' font-weight='800' fill='%23fff' text-anchor='middle' letter-spacing='-3'%3EBASE%3C/text%3E%3Crect x='36' y='132' width='108' height='5' rx='2.5' fill='%23FF9F0A'/%3E%3C/svg%3E">
<link rel="manifest" href="data:application/manifest+json,%7B%22name%22%3A%22BASE%22%2C%22short_name%22%3A%22BASE%22%2C%22start_url%22%3A%22.%22%2C%22display%22%3A%22standalone%22%2C%22background_color%22%3A%22%23000000%22%2C%22theme_color%22%3A%22%23000000%22%7D">
<style>
:root{
  --bg:#000; --card:#1b1c1f; --card2:#26272b; --line:rgba(255,255,255,.09);
  --tx:#fff; --dim:#8e8e93; --dim2:#5c5c61;
  --blue:#0A84FF; --mint:#30D158; --cyan:#64D2FF; --yellow:#FFD60A;
  --orange:#FF9F0A; --pink:#FF375F; --purple:#BF5AF2; --red:#FF453A;
  --sky:#5AC8FA; --brown:#AC8E68; --gray:#98989D;
  --r:22px;
  --pad:14px;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0;background:var(--bg);color:var(--tx)}
body{
  font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","SF Pro Text","Segoe UI",Inter,system-ui,sans-serif;
  font-feature-settings:"tnum" 1,"ss01" 1;
  -webkit-font-smoothing:antialiased;
  padding-bottom:80px;
}
.wrap{max-width:540px;margin:0 auto;padding:0 12px}
button,input,select,textarea{font:inherit;color:inherit}
button{background:none;border:0;cursor:pointer}
input,select,textarea{background:var(--card2);border:1px solid transparent;border-radius:10px;padding:8px 10px;outline:none}
input:focus,select,textarea:focus{border-color:rgba(255,255,255,.25)}
input[type=number]{-moz-appearance:textfield}
input::-webkit-outer-spin-button,input::-webkit-inner-spin-button{-webkit-appearance:none;margin:0}
:focus-visible{outline:2px solid var(--blue);outline-offset:2px}

/* ---------- header ---------- */
header{position:sticky;top:0;z-index:40;background:rgba(0,0,0,.72);backdrop-filter:saturate(180%) blur(20px);-webkit-backdrop-filter:saturate(180%) blur(20px);border-bottom:1px solid var(--line)}
.hrow{display:flex;align-items:flex-end;justify-content:space-between;padding:10px 0 8px}
.brand{font-size:30px;font-weight:800;letter-spacing:-.03em;line-height:1}
.brand span{color:var(--dim2)}
.hbtns{display:flex;gap:6px}
.iconbtn{width:34px;height:34px;border-radius:50%;background:var(--card2);display:grid;place-items:center;font-size:15px;color:var(--dim)}
.iconbtn:active{background:#3a3b40}

.strip{display:flex;gap:6px;overflow-x:auto;padding:2px 0 10px;scrollbar-width:none}
.strip::-webkit-scrollbar{display:none}
.dpill{flex:0 0 auto;width:46px;padding:7px 0 8px;border-radius:14px;background:var(--card);text-align:center;line-height:1.15}
.dpill .dw{font-size:10px;font-weight:700;letter-spacing:.08em;color:var(--dim)}
.dpill .dn{font-size:17px;font-weight:700;letter-spacing:-.02em}
.dpill .dl{font-size:9px;font-weight:800;letter-spacing:.06em;color:var(--dim2);margin-top:1px}
.dpill.sel{background:#fff;color:#000}
.dpill.sel .dw,.dpill.sel .dl{color:rgba(0,0,0,.5)}
.dpill.today .dn{color:var(--orange)}
.dpill.sel.today .dn{color:#000}

/* ---------- hero scoreboard ---------- */
.hero{background:var(--card);border-radius:var(--r);padding:16px var(--pad) 14px;margin:6px 0 10px;position:relative;overflow:hidden}
.hero:before{content:"";position:absolute;inset:0 auto 0 0;width:4px;background:var(--orange)}
.hero .eyebrow{display:flex;justify-content:space-between;align-items:center;font-size:11px;font-weight:700;letter-spacing:.09em;color:var(--dim);text-transform:uppercase}
.hero h1{margin:6px 0 3px;font-size:31px;font-weight:800;letter-spacing:-.035em;line-height:1.02}
.hero .sub{font-size:13px;color:var(--dim);font-weight:500}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:11px}
.chip{font-size:11px;font-weight:700;letter-spacing:.02em;padding:5px 9px;border-radius:9px;background:var(--card2);color:var(--dim)}
.chip b{color:#fff;font-weight:800}
.chip.warn{background:rgba(255,159,10,.15);color:var(--orange)}
.chip.live{background:rgba(48,209,88,.16);color:var(--mint)}
.tiers{margin-top:13px;display:grid;gap:7px}
.tierkey{width:100%;text-align:left;margin-top:9px;font-size:11px;font-weight:600;color:var(--dim2);line-height:1.4;padding:0}
.tierkey:active{color:var(--dim)}
.tier{display:grid;grid-template-columns:74px 1fr 40px;align-items:center;gap:9px}
.tier .tl{font-size:10.5px;font-weight:800;letter-spacing:.04em;color:var(--dim2);text-transform:uppercase}
.tier .tv{font-size:12px;font-weight:700;text-align:right;color:var(--dim);font-variant-numeric:tabular-nums}
.seg{height:7px;border-radius:4px;background:#0d0e10;overflow:hidden;display:flex}
.seg i{display:block;height:100%;transition:width .45s cubic-bezier(.2,.8,.2,1)}
.tier.t1 .seg i{background:var(--mint)} .tier.t1 .tl{color:var(--mint)}
.tier.t2 .seg i{background:var(--sky)}
.tier.t3 .seg i{background:var(--dim2)}

/* ---------- cards ---------- */
.catbar{display:flex;gap:6px;overflow-x:auto;padding:2px 0 4px;margin:0 0 2px;scrollbar-width:none}
.catbar::-webkit-scrollbar{display:none}
.cchip{flex:0 0 auto;display:flex;align-items:center;gap:6px;padding:7px 11px 7px 9px;border-radius:12px;background:var(--card);font-size:12px;font-weight:700;letter-spacing:-.01em;color:var(--dim)}
.cchip i{width:8px;height:8px;border-radius:50%;background:var(--ac,var(--gray));display:block}
.cchip b{font-weight:800;color:#fff;font-variant-numeric:tabular-nums}
.cchip.on{background:#fff;color:#000}
.cchip.on b{color:#000}
.cchip.gtog{color:var(--dim2);font-weight:800;font-size:11px;letter-spacing:.04em;text-transform:uppercase}
.sect{font-size:11px;font-weight:800;letter-spacing:.1em;color:var(--dim2);text-transform:uppercase;margin:16px 4px 7px}
.card{background:var(--card);border-radius:var(--r);padding:12px var(--pad);margin-bottom:8px;display:block;width:100%;text-align:left;position:relative;overflow:hidden;transition:transform .12s ease,background .15s}
.card:active{transform:scale(.985);background:#212226}
.card:before{content:"";position:absolute;left:0;top:0;bottom:0;width:4px;background:var(--ac,var(--gray));opacity:.9}
.card.done:before{width:4px}
.crow{display:flex;justify-content:space-between;align-items:flex-start;gap:10px}
.cmeta{font-size:10px;font-weight:800;letter-spacing:.09em;text-transform:uppercase;color:var(--ac,var(--gray));display:flex;align-items:center;gap:6px}
.cmeta .tg{color:var(--dim2);background:#0d0e10;padding:2px 5px;border-radius:5px;font-size:9px;letter-spacing:.06em}
.ctitle{font-size:20px;font-weight:700;letter-spacing:-.024em;margin-top:3px;line-height:1.12}
.csub{font-size:12.5px;color:var(--dim);margin-top:2px;line-height:1.35}
.score{text-align:right;flex:0 0 auto;padding-left:4px}
.score .num{font-size:26px;font-weight:800;letter-spacing:-.04em;line-height:1;font-variant-numeric:tabular-nums}
.score .den{font-size:12px;font-weight:700;color:var(--dim2);letter-spacing:-.02em}
.score.full .num{color:var(--mint)}
.mini{height:3px;border-radius:2px;background:#0d0e10;margin-top:11px;overflow:hidden}
.mini i{display:block;height:100%;background:var(--ac,var(--gray));transition:width .4s ease}
.card.done{background:#141614}
.card.done .ctitle{color:var(--dim)}
.tick{position:absolute;right:14px;bottom:11px;font-size:11px;font-weight:800;color:var(--mint);letter-spacing:.04em}

/* ---------- sheet ---------- */
.scrim{position:fixed;inset:0;background:rgba(0,0,0,.6);opacity:0;pointer-events:none;transition:opacity .25s;z-index:50}
.scrim.on{opacity:1;pointer-events:auto}
.sheet{position:fixed;left:0;right:0;bottom:0;top:26px;z-index:60;background:#0e0f11;border-radius:26px 26px 0 0;transform:translateY(101%);transition:transform .34s cubic-bezier(.22,.9,.28,1);display:flex;flex-direction:column;overflow:hidden}
.sheet.on{transform:translateY(0)}
.shead{padding:12px 16px 10px;border-bottom:1px solid var(--line);background:#0e0f11;position:relative}
.grab{width:36px;height:4px;border-radius:3px;background:#3a3b40;margin:0 auto 11px}
.shead .cmeta{margin-bottom:3px}
.shead h2{margin:0;font-size:25px;font-weight:800;letter-spacing:-.03em;line-height:1.08;padding-right:70px}
.shead p{margin:5px 0 0;font-size:13px;color:var(--dim);line-height:1.4;padding-right:70px}
.closeb{position:absolute;top:22px;right:14px;width:31px;height:31px;border-radius:50%;background:var(--card2);color:var(--dim);display:grid;place-items:center;font-size:16px;font-weight:700}
.sbody{flex:1;overflow-y:auto;padding:10px 12px 40px;-webkit-overflow-scrolling:touch}
.sbody .wrap{padding:0}

/* item rows */
.item{display:flex;gap:11px;align-items:flex-start;padding:11px 12px;background:var(--card);border-radius:14px;margin-bottom:6px}
.item.on{background:#152016}
.box{flex:0 0 auto;width:23px;height:23px;border-radius:50%;border:2px solid #4a4b50;display:grid;place-items:center;font-size:12px;color:transparent;margin-top:1px}
.item.on .box{background:var(--mint);border-color:var(--mint);color:#04270f}
.itxt{flex:1;min-width:0}
.iname{font-size:15px;font-weight:600;letter-spacing:-.01em;line-height:1.25}
.item.on .iname{color:var(--dim);text-decoration:line-through;text-decoration-color:rgba(255,255,255,.25)}
.icue{font-size:12.5px;color:var(--dim);margin-top:3px;line-height:1.38}
.idur{flex:0 0 auto;font-size:12px;font-weight:800;color:var(--dim2);background:#101114;padding:5px 8px;border-radius:9px;min-width:52px;text-align:center;font-variant-numeric:tabular-nums}
.idur.run{background:rgba(255,159,10,.16);color:var(--orange)}
.idur.done{color:var(--mint)}

.note{font-size:12.5px;color:var(--dim);line-height:1.45;background:var(--card);border-radius:14px;padding:11px 12px;margin-bottom:8px}
.note b{color:#fff}
.subhead{font-size:11px;font-weight:800;letter-spacing:.1em;color:var(--dim2);text-transform:uppercase;margin:16px 4px 7px}
.bigbtn{width:100%;padding:13px;border-radius:14px;background:var(--card2);font-size:15px;font-weight:700;letter-spacing:-.01em;margin-top:8px}
.bigbtn.pri{background:#fff;color:#000}
.bigbtn.dan{background:rgba(255,69,58,.16);color:var(--red)}

/* lift */
.ex{background:var(--card);border-radius:16px;padding:12px 12px 8px;margin-bottom:7px}
.exhead{display:flex;justify-content:space-between;gap:8px;align-items:baseline}
.exname{font-size:16px;font-weight:700;letter-spacing:-.02em;line-height:1.2}
.exslot{font-size:10px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:var(--dim2)}
.exscheme{font-size:13px;font-weight:800;color:var(--orange);flex:0 0 auto;font-variant-numeric:tabular-nums}
.exlast{font-size:11.5px;color:var(--dim2);margin-top:3px}
.excue{font-size:12.5px;color:var(--dim);margin-top:6px;line-height:1.4;display:none}
.excue.on{display:block}
.cuebtn{font-size:11px;font-weight:800;letter-spacing:.05em;color:var(--dim2);margin-top:6px;text-transform:uppercase}
.sets{margin-top:9px;display:grid;gap:5px}
.setrow{display:grid;grid-template-columns:34px 1fr 1fr 1fr 32px;gap:5px;align-items:center}
.setrow .sl{font-size:11px;font-weight:800;color:var(--dim2);letter-spacing:.04em}
.setrow input{padding:8px 6px;text-align:center;font-size:14px;font-weight:700;background:#101114;border-radius:9px;width:100%}
.setrow input::placeholder{color:#4a4b50;font-weight:600}
.setrow .sb{height:32px;border-radius:9px;background:#101114;color:#4a4b50;font-size:13px;font-weight:800;display:grid;place-items:center}
.setrow.on .sb{background:var(--mint);color:#04270f}
.setrow.on input{background:#152016}
.slabels{display:grid;grid-template-columns:34px 1fr 1fr 1fr 32px;gap:5px;font-size:9.5px;font-weight:800;letter-spacing:.08em;color:var(--dim2);text-transform:uppercase;text-align:center;margin-bottom:2px}
.slabels span:first-child{text-align:left}

/* rest timer bar */
.rest{position:sticky;bottom:0;margin:10px -12px -40px;padding:11px 16px calc(11px + env(safe-area-inset-bottom));background:rgba(14,15,17,.92);backdrop-filter:blur(18px);border-top:1px solid var(--line);display:flex;gap:7px;align-items:center}
.rest .rl{font-size:11px;font-weight:800;letter-spacing:.08em;color:var(--dim2);text-transform:uppercase;margin-right:auto}
.rest button{padding:8px 12px;border-radius:10px;background:var(--card2);font-size:13px;font-weight:800;font-variant-numeric:tabular-nums}
.rest button.run{background:var(--orange);color:#000}

/* forms */
.field{background:var(--card);border-radius:14px;padding:11px 12px;margin-bottom:6px}
.flabel{font-size:12px;font-weight:700;color:var(--dim);letter-spacing:-.005em;display:flex;justify-content:space-between;align-items:baseline}
.flabel b{font-size:16px;font-weight:800;color:#fff;font-variant-numeric:tabular-nums}
input[type=range]{-webkit-appearance:none;width:100%;background:transparent;margin:9px 0 1px;padding:0}
input[type=range]::-webkit-slider-runnable-track{height:5px;border-radius:3px;background:#101114}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:22px;height:22px;border-radius:50%;background:#fff;margin-top:-8.5px;box-shadow:0 1px 5px rgba(0,0,0,.5)}
input[type=range]::-moz-range-track{height:5px;border-radius:3px;background:#101114}
input[type=range]::-moz-range-thumb{width:22px;height:22px;border:0;border-radius:50%;background:#fff}
.seg3{display:flex;gap:5px;margin-top:8px}
.seg3 button{flex:1;padding:9px 4px;border-radius:10px;background:#101114;font-size:12px;font-weight:700;color:var(--dim)}
.seg3 button.on{background:#fff;color:#000}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.numfield{background:var(--card);border-radius:14px;padding:11px 12px}
.numfield label{font-size:11px;font-weight:800;letter-spacing:.07em;text-transform:uppercase;color:var(--dim2);display:block;margin-bottom:6px}
.numfield input{width:100%;font-size:19px;font-weight:800;padding:7px 9px;background:#101114}

/* fuel */
.gauge{background:var(--card);border-radius:16px;padding:13px 13px 11px;margin-bottom:6px}
.gtop{display:flex;justify-content:space-between;align-items:baseline}
.gname{font-size:12px;font-weight:800;letter-spacing:.07em;text-transform:uppercase;color:var(--dim2)}
.gval{font-size:23px;font-weight:800;letter-spacing:-.035em;font-variant-numeric:tabular-nums}
.gval small{font-size:12px;font-weight:700;color:var(--dim2);letter-spacing:0}
.gbar{height:8px;border-radius:5px;background:#101114;margin-top:9px;overflow:hidden}
.gbar i{display:block;height:100%;border-radius:5px;transition:width .4s ease}
.quick{display:flex;gap:5px;flex-wrap:wrap;margin-top:9px}
.quick button{padding:7px 10px;border-radius:10px;background:#101114;font-size:12px;font-weight:700;color:var(--dim)}

.empty{text-align:center;color:var(--dim2);font-size:13px;padding:26px 10px;line-height:1.5}
.foot{text-align:center;color:var(--dim2);font-size:11px;padding:22px 0 6px;letter-spacing:.02em;line-height:1.6}

/* ---------- movement guide ---------- */
.sheet2{z-index:70;top:44px}
.scrim2{z-index:65}
.demo{background:#111214;border-radius:16px;padding:6px;margin-bottom:8px;display:grid;place-items:center}
.demo img{width:100%;max-width:340px;border-radius:12px;display:block}
.stress{background:var(--card);border-radius:14px;padding:10px 12px;margin-bottom:6px}
.sr{display:grid;grid-template-columns:1fr 34px 34px 34px 34px;gap:4px;align-items:center;padding:5px 0;border-top:1px solid var(--line)}
.sr.sh{border:0;padding-bottom:7px}
.sr span{font-size:12.5px;font-weight:700;letter-spacing:-.01em}
.sr b{text-align:center;font-size:14px;font-weight:800;font-variant-numeric:tabular-nums}
.sr.sh b{font-size:9px;font-weight:800;letter-spacing:.04em;color:var(--dim2);text-transform:uppercase}
.sr b.w{color:var(--orange)} .sr b.z{color:var(--red)}
.vol{display:grid;grid-template-columns:1fr 74px 46px;gap:9px;align-items:center;background:var(--card);border-radius:13px;padding:10px 12px;margin-bottom:5px}
.vn{font-size:13.5px;font-weight:700;letter-spacing:-.01em;line-height:1.2}
.vn b{display:block;font-size:10px;font-weight:600;color:var(--dim2);margin-top:2px;letter-spacing:.02em}
.vb{height:6px;border-radius:4px;background:#0d0e10;overflow:hidden}
.vb i{display:block;height:100%;background:var(--mint)}
.vv{text-align:right;font-size:17px;font-weight:800;font-variant-numeric:tabular-nums}
.vv small{font-size:11px;font-weight:700;color:var(--dim2)}
.vol.low .vb i,.vol.high .vb i{background:var(--orange)}
.vol.low .vv,.vol.high .vv{color:var(--orange)}
.xp{background:var(--card);border-radius:14px;padding:11px 12px;margin-bottom:6px}
.xl{font-size:10px;font-weight:800;letter-spacing:.1em;text-transform:uppercase;color:var(--ac,var(--dim2));display:block;margin-bottom:4px}
.xp p{margin:0;font-size:14px;line-height:1.45;color:#e6e6e8}
.xp.warn{background:rgba(255,159,10,.1)}
.xp.warn .xl{color:var(--orange)}
.xp.warn p{color:#f0d5ab}
.ib{flex:0 0 auto;width:26px;height:26px;border-radius:50%;background:#101114;color:var(--dim2);font-size:13px;font-weight:800;display:grid;place-items:center;margin-top:0}
.tierbar{display:grid;grid-template-columns:1fr 1fr 1fr;gap:6px;margin-bottom:8px}
.tb{background:var(--card);border-radius:13px;padding:10px 8px;text-align:center}
.tb b{display:block;font-size:21px;font-weight:800;letter-spacing:-.04em;line-height:1}
.tb span{font-size:9px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:var(--dim2)}
.tb i{display:block;font-style:normal;font-size:11px;font-weight:700;color:var(--orange);margin-top:5px}
.tb u{display:block;text-decoration:none;font-size:10.5px;font-weight:700;color:var(--dim2);margin-top:1px}
.lt{margin:16px 2px 7px;font-size:12px;font-weight:600;color:var(--dim2);line-height:1.35}
.lt span{display:block;font-size:11px;font-weight:800;letter-spacing:.09em;text-transform:uppercase;color:var(--orange);margin-bottom:2px}
.lt1 span{color:var(--sky)} .lt2 span{color:var(--dim2)}
.ex-t1{background:#191a1d} .ex-t2{background:#161719}
.vrow{display:flex;gap:5px;align-items:center;margin-top:8px;flex-wrap:wrap}
.vlab{font-size:9.5px;font-weight:800;letter-spacing:.09em;text-transform:uppercase;color:var(--dim2);margin-right:2px}
.vpill{padding:6px 10px;border-radius:9px;background:#101114;font-size:11.5px;font-weight:700;color:var(--dim2)}
.vpill.on{background:rgba(255,159,10,.16);color:var(--orange)}
.exnote{margin-top:8px;background:rgba(255,159,10,.09);border-radius:11px;padding:8px 10px;font-size:13px;line-height:1.4;color:#f0d9b4}
.exnote span{display:block;font-size:9.5px;font-weight:800;letter-spacing:.09em;text-transform:uppercase;color:var(--orange);margin-bottom:3px}
.inote{margin-top:5px;font-size:12.5px;line-height:1.4;color:#f0d9b4;background:rgba(255,159,10,.09);border-radius:9px;padding:6px 8px}
.notewrap{margin-top:8px}
.exbtns{display:flex;gap:5px;margin-top:8px;flex-wrap:wrap}
.pill{padding:6px 10px;border-radius:9px;background:#101114;font-size:11.5px;font-weight:800;letter-spacing:.02em;color:var(--dim)}
.pill.go{background:rgba(255,159,10,.16);color:var(--orange)}
.pill.run{background:var(--orange);color:#000}
.mnote{width:100%;background:#101114;border-radius:12px;resize:vertical;padding:10px 11px;font-size:14px;line-height:1.4;min-height:76px}
.murl{width:100%;background:#101114;border-radius:12px;padding:10px 11px;font-size:13px}

.watch{display:flex;align-items:center;gap:11px;background:var(--card);border-radius:14px;padding:11px 13px;margin-bottom:8px;text-decoration:none;color:inherit}
.watch:active{background:#26272b}

function dayStats(L){

  return {core:[c.reduce((a,e)=>a+bouts(e),0),mins(c)],
          plus:[p.reduce((a,e)=>a+bouts(e),0),mins(p)],
          all:[ex.reduce((a,e)=>a+bouts(e),0),mins(ex)]};

function rpeFor(w){return w<=1?6:w===2?7:8}

function cardProgress(c,k){
  const d=D(k);
  if(c.type==='check'){const t=c.items.length;let n=0;c.items.forEach((_,i)=>{if(d.chk[c.id+':'+i])n++});return[n,t]}
  if(c.type==='lift'){const ex=LIFT[c.letter].ex.filter(e=>e.t===0);let t=0,n=0;
    ex.forEach(e=>{t+=e.s;const a=d.sets[e.id]||[];for(let i=0;i<e.s;i++)if(a[i]&&a[i].done)n++});return[n,t]}
  if(c.type==='pick'){return[1,1]}
  if(c.type==='checkin'){const f=['sleep','energy','soreness','stress'];return[f.filter(x=>d.checkin[x]!=null).length,4]}
  if(c.type==='fuel'){const p=+d.fuel.pro||0;return[Math.min(p,NUT.pro),NUT.pro]}
  if(c.type==='markers'){const f=['session','bw','recovery','sleepH','energy'];return[f.filter(x=>d.markers[x]!=null&&d.markers[x]!=='').length,5]}
  if(c.type==='weekly'){return[d.chk['week:0']?1:0,1]}
  return[0,1];
}
function tierTotals(k){
  const t={1:{done:0,total:0,pct:0},2:{done:0,total:0,pct:0},3:{done:0,total:0,pct:0}};
  const acc={1:[],2:[],3:[]};
  cardsFor(k).forEach(c=>{
    const[n,d]=cardProgress(c,k), f=d?Math.min(1,n/d):0;
    acc[c.tier].push(f); t[c.tier].total++; if(f>=1)t[c.tier].done++;
  });
  [1,2,3].forEach(i=>{const a=acc[i];t[i].pct=a.length?Math.round(a.reduce((x,y)=>x+y,0)/a.length*100):0});
  return t;
}
function streak(){
  let n=0,d=new Date();
  for(let i=0;i<400;i++){
    const k=iso(d), day=S.days[k];
    if(!day){ if(i===0){d.setDate(d.getDate()-1);continue} break }
    const t=tierTotals(k)[1];
    if(t.total>0 && t.pct>=75) n++; else if(i>0) break; 
    d.setDate(d.getDate()-1);
  }
  return n;
}

function programBody(){
  return `<div class="subhead">Design principles</div>
  <div class="note">This program is not optimising for the perfect training week. It is optimising for <b>schedule resilience</b>.<br><br>
  1. No single workout owns a muscle group.<br>
  2. No single workout owns the hardest exercises.<br>
  3. Every workout should leave you feeling like you could come back tomorrow.<br>
  4. Missing any one day should reduce volume, not eliminate a body part.</div>
  <div class="note">Not "full body". <b>Full exposure.</b> Every day exposes the whole body to meaningful work. It does not mean every muscle gets direct isolation work every day.<br><br>
  The test for a day is not whether it contained one exercise per body part. It is: <b>if this were my only workout this week, would I feel like I trained my whole body?</b></div>

  <div class="subhead">The day has a floor</div>
  <div class="note"><b>Core four.</b> Knee, hip, push, pull. Do these or the day does not count. Four compounds cover quads, hamstrings, glutes, chest, back, both delts and both arms. Around 50 minutes.<br><br>
  <b>Plus two.</b> The second pull and a delt. The two things four compounds under-serve and the two your goals care most about. Around 67 minutes.<br><br>
  <b>Finisher.</b> One arm, calf or leg curl exercise. First thing to go, always. Nothing is lost by never doing it.</div>

  <div class="subhead">Sets versus bouts</div>
  <div class="note">A prescription written 3×8/side is three <b>sets</b> for each limb, but six <b>bouts</b> of work with six rest periods. Sets is what the muscle sees. Bouts is what your evening sees. Both numbers are shown so neither can hide.</div>

  <div class="subhead">Weekly volume</div>`+volumeBody()+`

  <div class="subhead">The stress test</div>`+stressBody()+`

  <div class="subhead">Progression</div>
  <div class="note">RPE 6 in week 1, RPE 7 in week 2, RPE 8 from week 3. Sets stay at 3 on the big patterns from day one, only the load ramps, because the limiter is tendon and connective tissue rather than muscle.<br><br>
  <b>Hit the top of the rep range at or below target RPE once, then add the smallest increment.</b> One session, not two. With each exercise appearing once a week, the old two-session rule meant a two-week wait for every load increase.</div>
  <div class="note"><b>Deload every five to six weeks.</b> Cut sets 40-50%, same movements, RPE 5-6, resume the week after. Pull it forward if joint or energy markers are trending down.</div>

  <div class="subhead">No barbell work</div>
  <div class="note">The gym has a barbell, a rack and a Smith machine. This program uses none of them.<br><br>
  <b>The left shoulder.</b> A fixed bar path forces both arms onto one line and gives the joint nowhere to go mid-rep. Rules out barbell and Smith bench and overhead press.<br>
  <b>Anterior pelvic tilt.</b> A bar on the back gives no cue to stay upright. The goblet position does it automatically. Rules out back squats.<br>
  <b>The pelvic floor trial.</b> Maximal bracing spikes intra-abdominal pressure. Rules out conventional deadlifts.<br>
  <b>Connective tissue.</b> Still the limiter for a returning trainee.</div>
  <div class="note"><b>Where the squat goes from here.</b> Goblet squats cap out around 100 to 120 lb. At 3×10 at RPE 7 or easier with the heaviest bell, heavy bilateral quad loading moves to the leg press, already on Day 3. A hack, pendulum or belt squat would be better still.</div>

  <div class="subhead">The floor</div>
  <div class="note"><b>Bad week:</b> 3 lifts at core four, corrective work most days, daily-ish walking, protein floor 5 of 7 days.<br><b>Travel or life blew up:</b> walk, hit protein, two sessions of any four compounds, any gym. That keeps the chain of re-entries intact, which is the actual behavioral goal.</div>
  <div class="note"><b>No make-up rule inside the week.</b> A missed day is missed, never double up. Saturday is the one exception: it repeats whichever day you dropped.<br><b>Sleep wins automatically.</b> Poor recovery signal means walk over lift.</div>

  <div class="subhead">Priority when it goes sideways</div>
  <div class="note">Every card carries one of three labels. A priority order for bad weeks, not a judgement of what matters.<br><br>
  <b>MUST DO</b> never moves: sleep, protein and calories, the lift or the bad-day floor, the walk.<br>
  <b>PROTOCOL</b> gives way next: the AM and PM protocols.<br>
  <b>EXTRA</b> goes first: desk resets, red light, skincare tools, the optional lymph work.<br><br>
  Skipping gua sha is not failure. Skipping protein is what costs muscle.</div>

  <div class="subhead">The colour code</div>
  <div class="note">${CATORDER.map(k=>`<span style="color:var(${CATS[k].ac})">■</span> <b>${CATS[k].n}</b> — ${CATS[k].d}`).join('<br>')}
  <br><br>Tap any category at the top of the day to see only that category.</div>`;
}

let tHandle=null,tEl=null,tEnd=0,tKey=null,tTotal=0,wakeLock=null,AC=null;

function armAudio(){try{AC=AC||new (window.AudioContext||window.webkitAudioContext)();
  if(AC.state==='suspended')AC.resume()}catch(e){}}
function beep(n){try{if(!AC)return;const t0=AC.currentTime;
  for(let i=0;i<(n||2);i++){const o=AC.createOscillator(),g=AC.createGain(),t=t0+i*0.22;
    o.type='sine';o.frequency.value=i?1046:880;
    g.gain.setValueAtTime(0.0001,t);g.gain.exponentialRampToValueAtTime(0.35,t+0.012);
    g.gain.exponentialRampToValueAtTime(0.0001,t+0.18);
    o.connect(g);g.connect(AC.destination);o.start(t);o.stop(t+0.2)}}catch(e){}}
async function requestWake(){try{if('wakeLock' in navigator && !wakeLock)
  wakeLock=await navigator.wakeLock.request('screen')}catch(e){}}
function releaseWake(){try{if(wakeLock&&S.awake!==true){wakeLock.release();wakeLock=null}}catch(e){}}

function stopTimer(){if(tHandle)clearInterval(tHandle);tHandle=null;
  if(tEl){tEl.classList.remove('run');tEl=null}releaseWake()}
function tickTimer(){
  if(!tEl)return;
  const left=Math.max(0,Math.round((tEnd-Date.now())/1000));
  tEl.textContent=left>0?fmt(left):'done';
  if(left<=0){
    clearInterval(tHandle);tHandle=null;
    tEl.classList.remove('run');tEl.classList.add('done');
    beep(); if(navigator.vibrate)navigator.vibrate([90,60,90,60,140]);
    if(tKey&&tKey!=='rest'){D(cur).chk[tKey]=true;save();
      const row=sbody.querySelector(`[data-tog="${tKey}"]`); if(row)row.classList.add('on');}
    tEl=null; releaseWake();
  }
}
function startTimer(el,secs,forKey){
  if(tEl===el){stopTimer();el.textContent=fmt(secs);return}
  stopTimer(); armAudio(); requestWake();
  tEl=el; tKey=forKey; tTotal=secs; tEnd=Date.now()+secs*1000;
  el.classList.add('run'); el.classList.remove('done');
  tickTimer(); tHandle=setInterval(tickTimer,250);
}
document.addEventListener('visibilitychange',()=>{
  if(document.visibilityState==='visible'){ if(tEl){tickTimer(); requestWake();} else if(S.awake===true)requestWake(); }
});

function tc(str){
  return String(str).split(' ').map(w=>{
    if(!w)return w;
    return w.split(/([-\/+])/).map(pt=>{
      if(!pt||/^[-\/+]$/.test(pt))return pt;
      if(/[A-Z]/.test(pt)&&pt===pt.toUpperCase())return pt;
      if(/^\d/.test(pt))return pt;
      return pt[0].toUpperCase()+pt.slice(1);
    }).join('');
  }).join(' ');

'wall-slide-or-band-pass-through':{a:'wallslide',s:'Back against a wall, feet a foot out, low back flat. Elbows and wrists on the wall at shoulder height.',
 d:'Slide the arms up the wall as far as you can keep contact and keep the ribs down, then slide back. 10 reps, slow. Band version: wide grip, take the band from front to overhead to behind, wide enough that nothing pinches.',
 f:'Work between the shoulder blades and a stretch across the front of the chest.',
 x:'Letting the ribs flare so the arms can go higher. Less range with the ribs down beats more range with an arched back.',
 w:'Pinching in the left shoulder. Narrow the band grip or reduce the slide height.'},
'glute-bridge':{a:'bridge',s:'On your back, knees bent, feet flat and about hip width, arms at the sides.',
 d:'Exhale, tuck the pelvis slightly, then drive through the heels and lift the hips until the body is a straight line from knee to shoulder. Squeeze 2 seconds at the top. Lower under control. 10 reps.',
 f:'Glutes. Strongly.',
 x:'Arching the low back at the top and calling it height. Tuck first, then lift, and stop where the arch would begin.'},
'ramp-sets-on-the-first-exercise':{a:null,s:'Only on the first exercise of the day.',
 d:'One set at roughly 50% of your working weight for 5 reps, then one at roughly 70% for 3 reps. Both are practice, not effort. Neither counts as a working set.',
 f:'The pattern, not fatigue. You should finish these feeling more ready, not warmed out.',
 x:'Turning the ramp into a third working set.'},
/* ---------- cool-down ---------- */
'couch-stretch':{a:'holdcouch',s:'Back shin up against a wall or couch, back knee on a pad, front foot planted forward.',
 d:'Tuck the pelvis under first, then slowly bring the torso upright. 45 seconds per side. Breathe out long.',
 f:'The front of the back-leg thigh and hip. This is the direct counter to anterior pelvic tilt.',
 x:'Coming upright without tucking the pelvis, which just arches the low back and skips the hip flexor.',
 w:'Knee pain on the down leg. Add padding or reduce the shin angle.'},
'thoracic-extension-over-roller':{a:'roll',s:'Roller across the mid back, knees bent, feet flat, hands supporting the head.',
 d:'Keep the ribs from flaring, let the upper back drape backward over the roller, breathe, then move the roller an inch and repeat. Stay above the bottom of the ribcage.',
 f:'Extension opening in the mid back, not the low back.',
 x:'Rolling down onto the low back. The lumbar spine does not need more extension, it already has too much.'},
'foot-rolling':{a:'roll',s:'Seated or standing, ball or roller under the arch.',
 d:'Slow passes heel to toe, 60 seconds per foot. Cover three lanes: inside, center, outside.',
 f:'Tender spots releasing under the arch.',
 x:'Fast scrubbing. Slow is what changes tissue.',
 w:'Sharp pain in the left foot. Reduce pressure. That foot is still settling.'},
'happy-baby-or-butterfly':{a:'holdhappy',s:'On your back. Happy baby: knees toward the armpits, hands on the outside of the feet. Butterfly: soles together, knees falling out.',
 d:'Hold and breathe. Long exhales. Let gravity do it. 60 seconds.',
 f:'Inner thigh and deep hip letting go.',
 x:'Pulling hard on the feet. This is a release position, not a stretch to win.'},
'360-breathing-long-exhales':{a:'breathe',s:'Lying down, hands on the lower ribs.',
 d:'Five breaths. In for 4, out for 8 or longer. Fully empty each time. This is the switch out of training mode.',
 f:'The ribs settling down and the whole system dropping a gear.',
 x:'Rushing it because the session is over.'},
/* ---------- PM protocol ---------- */
'90-90-breathing':{a:'breathe90',s:'On your back, lower legs resting on a chair or couch so hips and knees are both at 90°. Arms relaxed.',
 d:'3 minutes. Slow nasal inhale into the lower ribs and back, long passive exhale. Let everything below the belt go completely slack, including the pelvic floor.',
 f:'The low back settling toward the floor and the pelvic floor releasing downward.',
 x:'Any squeezing or lifting down there. This is down-training. Never kegels.',
 w:'Symptoms stay flat, get worse, or hurt across four to six weeks. That is the trigger to see a pelvic floor PT, not to try harder.'},
'psoas-release-with-ball':{a:'roll',s:'Face down, ball placed just inside the hip bone, below the level of the belt line.',
 d:'Sink onto it slowly. Breathe. When you find a tender spot, stay there and exhale rather than grinding. 2 minutes per side.',
 f:'A deep dull ache that fades as you breathe.',
 x:'Rolling around aggressively. Pressure plus breathing beats movement here.',
 w:'Anything sharp, pulsing, or radiating. Come off it immediately.'},
'happy-baby-then-butterfly':{a:'holdhappy',s:'On your back. Happy baby first, then let the legs fall into butterfly.',
 d:'2 minutes total, breathing long. When you finish, log the tension number so the four to six week pelvic floor trial has real data.',
 f:'Inner thigh and pelvic floor releasing. That release is the whole point.',
 x:'Bracing through it. If you are gripping, you are working against the goal.'},
/* ---------- Sunday reset ---------- */
'tennis-ball-foot-roll':{a:'roll',s:'Seated to start, standing once you can tolerate it. Ball under the foot.',
 d:'2 minutes per foot. Three lanes: inside edge, center, outside edge. Slow, deliberate passes.',
 f:'Tender spots softening. The whole foot should feel wider afterward.',
 x:'Only rolling the center. The arch collapse is an edge-to-edge problem.',
 w:'Sharp pain in the left foot. Back the pressure off.'},
'short-foot-toe-control':{a:'shortfoot',s:'Standing, weight even, toes long.',
 d:'Lift the arch by drawing the ball of the foot toward the heel, toes staying flat. Hold 3 to 5 seconds. Then practice lifting just the big toe, then just the other four. 2 sets of 10.',
 f:'A working cramp under the arch and a clumsy, hard-to-coordinate feeling in the toes. That clumsiness is the point.',
 x:'Curling the toes or rolling to the outside of the foot.'},
'tibialis-raises':{a:'tib',s:'Heels a few inches from a wall, back leaning against it, legs straight.',
 d:'Pull the toes up toward the shins as far as they go, then lower slowly. 2 sets of 15.',
 f:'A hard burn down the front of the shin.',
 x:'Bending the knees to cheat range.'},
'single-leg-calf-raise':{a:'calf',s:'One foot on the floor or on a step, fingertips on a wall for balance only.',
 d:'Rise all the way up, pause at the top, lower slowly to a full stretch. 2 sets of 12 per side.',
 f:'Calf, through the whole range. The bottom stretch matters as much as the top.',
 x:'Bouncing. Also: not noticing the side-to-side difference. That difference is data about the left foot.'},
'banded-ankle-distraction':{a:'shortfoot',s:'Band around the front of the ankle, anchored low and behind you so it pulls the ankle bone backward. Foot flat on a box.',
 d:'Drive the knee forward over the toes, keeping the heel glued down. Small oscillations, 2 minutes per side.',
 f:'Space opening at the front of the ankle, not pinching.',
 x:'Letting the heel lift, which turns it into a calf stretch instead of a joint mobilization.'},
'single-leg-balance-eyes-closed':{a:'balance',s:'Barefoot on a firm floor, near a wall you can touch.',
 d:'Stand on one leg, find the arch, then close the eyes. 3 rounds of 30 seconds per leg. Touching the wall to reset is fine.',
 f:'Constant micro-corrections through the foot and ankle. That is the training.',
 x:'Gripping with the toes. Keep them long and let the arch do the work.'},
'all-fours-breathing':{a:'breathequad',s:'Hands under shoulders, knees under hips, spine neutral, ribs stacked down.',
 d:'5 minutes. 4 seconds in through the nose, 6 out. Push the floor away slightly so the upper back stays broad.',
 f:'The back of the ribcage expanding into the space behind you. Most people have never felt this.',
 x:'Letting the low back sag. Neutral, not arched.'},
'couch-stretch-chin-tuck':{a:'holdcouch',s:'Couch stretch position, back shin elevated, pelvis tucked.',
 d:'Hold the stretch and add chin tucks while you are there. 2 minutes per side. Two problems, one position.',
 f:'Hip flexor stretch below, deep neck flexors working above.',
 x:'Losing the pelvic tuck the moment you start thinking about the neck.'},
'frog-or-butterfly':{a:'holdfrog',s:'Frog: knees wide on a padded floor, shins in line with the thighs, forearms down. Butterfly: seated, soles together.',
 d:'Sink back slowly and breathe. 2 minutes. Let gravity work rather than pushing.',
 f:'Inner thigh and groin.',
 x:'Bouncing or forcing depth.',
 w:'Pain rather than stretch in the left hip. Clicking on its own is fine. Pain is the stop signal.'},
'quadruped-t-spine-rotation':{a:'tspine',s:'All fours, one hand behind the head, elbow pointing down.',
 d:'Rotate the elbow up toward the ceiling, following it with your eyes. Hips stay square to the floor. 5 reps per side.',
 f:'Rotation in the mid back only.',
 x:'Letting the hips twist, which lets the low back do the rotating instead.'},
/* ---------- desk ---------- */
'posture-reset':{a:'chintuck',s:'Wherever you are sitting.',
 d:'Feet flat, sit bones down, ribs stacked over the pelvis, one chin tuck, shoulders back and down once. Five seconds total.',
 f:'Taller without effort.',
 x:'Pulling the shoulders back and holding a military posture. You cannot hold a position, you can only keep returning to it.'},
'stand-walk-break':{a:'walk',s:'Set an hourly reminder.',
 d:'Stand up and walk for two minutes. Anywhere. The point is breaking the sitting block, not the distance.',
 f:'Hips unlocking.',
 x:'Standing up and immediately sitting back down.'},
'seated-posterior-pelvic-tilt':{a:'wave',s:'Seated, feet flat, hands on the hip bones.',
 d:'Roll the pelvis backward under you, flattening the low back slightly, hold 5 seconds, release to neutral. Repeat a few times.',
 f:'The low arch flattening and the lower abs switching on.',
 x:'Slumping the whole upper body. Only the pelvis moves.'},
'short-foot-toe-control-under-the-desk':{a:'shortfoot',s:'Shoes off under the desk.',
 d:'Same arch lift as the Sunday version. A few reps per side whenever you notice. Nobody can see you doing it.',
 f:'Arch working.',
 x:'Forgetting it exists. This one is free reps.'},
'360-breathing-on-calls':{a:'breathe',s:'On any call where you are listening more than talking.',
 d:'Nasal inhale into the lower ribs, long exhale. Ribs down at the end of each one.',
 f:'Stress dropping and rib position resetting.',
 x:'Breathing into the chest, which is the default under stress.'},
'chin-tucks-seated-or-wall':{a:'chintuck',s:'Seated upright, or against a wall if one is handy.',
 d:'Head slides straight back, chin level, 5 seconds on, 2 off. A few reps.',
 f:'Stretch at the base of the skull.',
 x:'Nodding the chin down instead of gliding the head back.'},
/* ---------- the walk ---------- */
'20-40-min-easy-walk':{a:'walk',s:'Outside if possible. Comfortable shoes.',
 d:'20 to 40 minutes at a pace where you could hold a conversation. Breathe through the nose. Every day, lift or no lift.',
 f:'Easy. If it feels like training, slow down.',
 x:'Turning it into cardio. This exists to sustain the deficit without adding training stress. It is not the lift\u2019s job.'},
/* ---------- lift: hinge ---------- */
'db-romanian-deadlift':{a:'hinge',s:'Dumbbells in front of the thighs, feet hip width, knees softly bent and staying that way.',
 d:'Push the hips straight back and let the dumbbells track down the thighs. 3 seconds down to mid-shin. Stand up by driving the hips forward. Flat back throughout. Full range, no maximal bracing.',
 f:'Hamstrings loading like a stretched band. Glutes finish the lift.',
 x:'Squatting it. If the knees travel forward and the hips drop, it stopped being a hinge.',
 w:'Low back taking over instead of hamstrings. Shorten the range and slow the descent.'},
'db-rdl-wide-stance-or-paused':{a:'hinge',s:'Same as the Day A RDL but with a slightly wider stance, or add a 2 second pause at the bottom.',
 d:'Same hinge. The wide stance shifts more into the inner hamstring and adductor. The pause kills the stretch reflex so the hamstring has to start the lift cold.',
 f:'Same pattern, different emphasis. The paused version will feel harder at the same weight, which is the point.',
 x:'Treating it as a heavier day. Different stimulus, not more load.'},
'b-stance-db-rdl':{a:'hinge1',s:'One dumbbell. Front foot flat carrying most of the weight, back foot a half step behind with just the toes touching down for balance.',
 d:'Hinge over the front leg. Roughly 80% of the load is on that leg. Hips stay square to the front, no rotation. 8 per side.',
 f:'One hamstring at a time, plus real work from the glute holding the pelvis level.',
 x:'Letting the hip of the back leg drift open. Square hips are the whole reason this variation exists.'},
'leg-curl-machine':{a:'legcurl',s:'Pad sitting just above the heels, not on the achilles. Hips flat against the bench.',
 d:'Curl the heels toward the glutes through the full range, pause briefly, lower under control. 10 to 12 reps.',
 f:'Hamstrings at the knee end. The RDL trains the hip end, this trains the other.',
 x:'Lifting the hips off the pad and swinging the stack. Lower the weight instead.'},
'leg-curl-single-leg':{a:'legcurl',s:'Same setup, one leg at a time, weight roughly a third of your two-leg load to start.',
 d:'Curl and then lower far slower than you curled. This is the harder version of the week. 8 to 10 per side.',
 f:'The eccentric. The lowering should be the hard part.',
 x:'Rushing the return. If both directions take the same time, you skipped the stimulus.'},
'leg-curl-higher-rep':{a:'legcurl',s:'Same machine, meaningfully lighter than Day A.',
 d:'12 to 15 controlled reps. Third angle in the rotation, aimed at volume and blood flow rather than load.',
 f:'A burn rather than a strain.',
 x:'Loading it like Day A. Lighter is the assignment.'},
/* ---------- lift: squat ---------- */
'kb-goblet-squat':{a:'squat',s:'Bell held at the chest, elbows tucked in, feet shoulder width and slightly turned out, ribs stacked down.',
 d:'Sit down between the hips to a moderate depth, knees tracking over the toes, chest tall. Drive up through the whole foot. The bell in front counterbalances you into staying upright automatically.',
 f:'Quads and glutes. Upper back working to hold the bell.',
 x:'Letting the ribs flare and the low back arch at the bottom. That is the exact compensation this program is undoing.',
 w:'Stays goblet. Graduate to a barbell only when you hit 3 sets of 10 at RPE 7 or easier with the heaviest comfortable bell.'},
'heels-elevated-goblet-squat':{a:'squat',s:'Small plate or wedge under the heels. Same goblet hold.',
 d:'The heel lift lets you sit deeper without forcing the ankle or the hip into a range they do not own yet. 8 to 10 reps, still goblet.',
 f:'More quad, deeper position, less strain at the bottom.',
 x:'Using the elevation to grind out depth you cannot control. Depth still stops where the low back would round.'},
'db-split-squat':{a:'split',s:'Long stance, dumbbells at the sides, torso tall, front foot flat.',
 d:'Lower the back knee toward the floor straight down, not forward. Front shin stays fairly vertical. Drive up through the front heel. 8 per side.',
 f:'Front-leg quad and glute, plus a stretch through the front of the back-leg hip.',
 x:'Too short a stance, which turns it into a knee-forward lunge.',
 w:'The back-leg hip flexor complains or the left hip catches. Shorten the stance.'},
/* ---------- lift: press ---------- */
'db-floor-press':{a:'pressfloor',s:'On the floor, knees bent, dumbbells over the chest, neutral or slightly angled grip.',
 d:'Lower for 3 seconds until the upper arms touch the floor, brief pause, press back up. The floor stops the range before the shoulder gets into trouble.',
 f:'Chest and triceps, with the shoulder feeling supported rather than stretched.',
 x:'Bouncing the elbows off the floor. Pause, then press.',
 w:'This variation exists for the left shoulder. Never substitute a barbell here.'},
'low-incline-db-press-neutral':{a:'pressinc',s:'Bench at 15 to 30°, palms facing each other, dumbbells over the lower chest.',
 d:'3 seconds down to a deep stretch at the bottom, press back up without clanging the dumbbells together at the top.',
 f:'Upper chest with a long stretch at the bottom.',
 x:'Setting the bench too steep, which turns it into a shoulder press.',
 w:'Neutral grip is deliberate. It keeps the left shoulder out of the position that provokes it.'},
'flat-db-bench-press':{a:'press',s:'Flat bench, dumbbells at the sides of the chest, feet planted, shoulder blades set down and back.',
 d:'Full dumbbell range, controlled down, press up and slightly together. Each arm finds its own path, which is the entire reason this is not a barbell.',
 f:'Chest across the full range.',
 x:'Flaring the elbows straight out to 90°. Keep them at roughly 45 to 60° from the body.',
 w:'No barbell bench, ever, regardless of gym access. A fixed bar path gives the shoulder nowhere to go if it is not tracking clean that day.'},
'half-kneeling-db-press':{a:'overhead',s:'Half-kneeling, one knee down, dumbbell at shoulder height, neutral grip. Pelvis tucked slightly.',
 d:'Press straight up to a full lockout, biceps near the ear, ribs staying down. Lower under control. The half-kneeling stance removes the option of arching the low back to finish the rep.',
 f:'Shoulder and triceps working, core resisting the arch.',
 x:'Leaning back to complete the press. If the ribs flare, the weight is too heavy.',
 w:'Never a barbell overhead. A dumbbell lets each arm find its own line.'},
'standing-single-arm-db-press':{a:'overhead',s:'Standing, one dumbbell at shoulder height, feet hip width, other arm free.',
 d:'Press overhead without leaning away from the weight. 8 per side. The stability demand is different from the half-kneeling version, which is why both are in the week.',
 f:'Shoulder pressing, obliques on the opposite side working hard to keep you upright.',
 x:'Side-bending away from the dumbbell to shorten the distance.'},
/* ---------- lift: pull ---------- */
'lat-pulldown':{a:'pulldown',s:'Thighs locked under the pad, grip slightly wider than shoulders, small lean back.',
 d:'Pull to the upper chest by driving the elbows down and back, not by yanking with the hands. Control the bar all the way up to a full stretch. 6 to 8 reps.',
 f:'Lats, with the shoulder blades sliding down before the arms bend.',
 x:'Rocking the torso to move the stack. If you are swinging, drop the weight.'},
'chest-supported-db-row':{a:'row',s:'Chest on an incline bench set around 30 to 45°, dumbbells hanging straight down.',
 d:'Row by driving the elbows back toward the hips, squeeze the shoulder blades briefly, lower fully. 10 reps. The bench means the low back does nothing at all.',
 f:'Mid back and rhomboids. This is the direct antidote to the rounded shoulder position.',
 x:'Shrugging toward the ears instead of pulling the blades together.'},
'one-arm-db-row':{a:'row',s:'One hand and one knee on the bench, other foot planted, flat back, dumbbell hanging.',
 d:'Row the dumbbell toward the hip, elbow leading. No twist through the torso. Full stretch at the bottom. 8 per side. This is the heaviest rowing of the week.',
 f:'Lat and mid back on the working side.',
 x:'Rotating the torso open to get the weight higher. If the shoulder turns toward the ceiling, the lat stopped working.'},
'cable-face-pull':{a:'facepull',s:'Rope at roughly face height, thumbs pointing back, elbows high.',
 d:'Pull the rope toward the forehead, separating the hands, and finish by rotating the knuckles back. 15 reps, light.',
 f:'Rear delts and the small external rotators behind the shoulder.',
 x:'Turning it into a heavy high row. Light weight and clean external rotation is the whole exercise.'},
/* ---------- lift: delts and arms ---------- */
'cable-lateral-raise':{a:'latraise',s:'Low pulley, cable running behind you, working arm across the body to start.',
 d:'Lead with the elbow and raise to shoulder height, no higher. Slow, controlled return. The cable keeps tension on at the bottom where a dumbbell has none.',
 f:'Side delt, constant tension through the whole range.',
 x:'Shrugging or swinging the body to start the rep.',
 w:'Stop at shoulder height. Above that the left shoulder is in the range you are avoiding.'},
'db-lateral-raise':{a:'latraise',s:'Dumbbells at the sides, slight forward lean, small bend in the elbows.',
 d:'Raise to shoulder height leading with the elbows, lower slowly. 12 reps. Different implement from the cable version, on purpose.',
 f:'Side delt, hardest in the middle of the range.',
 x:'Going heavy enough that the traps take over.'},
'ez-bar-curl':{a:'curl',s:'Shoulder-width grip on the angled part of the bar, elbows pinned to the ribs.',
 d:'Curl without the elbows drifting forward, lower slowly to a full stretch. 10 to 12 reps.',
 f:'Biceps, with a stretch at the bottom.',
 x:'Swinging the bar up with the low back.'},
'reverse-curl-db-or-ez-bar':{a:'curl',s:'Palms down, elbows tucked in, light weight.',
 d:'Curl with the palms facing the floor the whole way. 12 to 15 reps. Much lighter than a normal curl and that is correct.',
 f:'Forearm extensors and the outside of the elbow.',
 x:'Going heavy and letting the wrists collapse. This is elbow insurance, not an arm builder.'},
'cable-rope-pushdown':{a:'pushdown',s:'Rope at the top pulley, elbows pinned to the ribs, small forward lean.',
 d:'Extend to a full lockout, spreading the rope slightly at the bottom. Control the return. 12 reps.',
 f:'Triceps, hardest at lockout.',
 x:'Letting the elbows drift forward and turning it into a press.',
 w:'This replaces overhead triceps extensions on purpose. It keeps the left shoulder out of a loaded overhead position.'},
/* ---------- lift: calves, core, carries ---------- */
'calf-raise-machine':{a:'calf',s:'Balls of the feet on the platform, heels free to drop below.',
 d:'Full stretch at the bottom, drive all the way up, pause at the top. 15 reps.',
 f:'Calf through the full range. The bottom stretch does as much as the top squeeze.',
 x:'Short bouncy reps.'},
'single-leg-calf-raise-bodyweight':{a:'calf',s:'One leg, fingertips on something for balance only.',
 d:'12 per side, full range, pause at the top. Note which side is weaker.',
 f:'Calf. And the side-to-side difference, which is real information about the left foot.',
 x:'Leaning on the support and taking weight off the leg.'},
'seated-calf-raise-machine':{a:'calf',s:'Knees bent to about 90° under the pad.',
 d:'Full stretch, full contraction, pause at the top. 15 reps.',
 f:'Lower calf, the soleus. Bending the knee is what shifts the work there, which is why the straight-leg versions miss it.',
 x:'Short range. This muscle only responds to the ends.'},
'cable-pallof-press':{a:'pallof',s:'Cable at chest height, standing side-on, hands at the sternum, feet planted.',
 d:'Press the hands straight out and hold briefly while the cable tries to rotate you. Resist. Bring it back in. 10 per side.',
 f:'Obliques and deep core resisting rotation. Nothing should actually move.',
 x:'Letting the torso turn toward the machine, or letting the ribs flare as the arms extend.'},
'dead-bug':{a:'deadbug',s:'On your back, arms straight up, knees and hips at 90°. Low back pressed flat.',
 d:'Exhale and lower the opposite arm and leg toward the floor, slowly. Only go as far as the low back stays flat. Return, switch. 10 per side.',
 f:'Deep abs working hard to keep the back flat while the limbs move.',
 x:'Letting the back arch off the floor. The rep ends the instant that happens, no matter how far the limbs got.'},
'farmer-walk':{a:'carry',s:'Heaviest dumbbells you can hold, one in each hand, standing tall.',
 d:'Walk 40 steps with the ribs down, shoulders back, and a normal stride. Do not rush.',
 f:'Grip failing first. Everything else is holding position.',
 x:'Leaning back to support the weight.'},
'suitcase-carry':{a:'carry',s:'One dumbbell or bell in one hand only. Stand tall.',
 d:'Walk 40 steps without leaning away from the load, then switch sides. Shoulders level, ribs down.',
 f:'The obliques on the opposite side working the entire walk.',
 x:'Side-bending away from the weight, which removes the whole training effect.'},
'suitcase-carry-or-side-plank':{a:'sideplank',s:'Suitcase carry as above, or side plank on the forearm with the body in a straight line.',
 d:'30 steps per side, or a 30 second side plank per side. Either way this is the anti-side-bend slot.',
 f:'The obliques on the down side holding the hips up.',
 x:'Letting the hips sag toward the floor in the plank, or drifting into a twist.'}
};


/* ---- machine variations ---- */
MOVE['seated-leg-curl']={s:'Seated, back against the pad, thighs strapped down, knees lined up with the machine\u2019s pivot. Ankle pad just above the heels.',
 d:'Curl the heels down and under until the knees are fully bent, brief pause, return slowly to a full straight-leg stretch. 10 to 12 reps.',
 f:'A hard stretch in the hamstrings at the top of every rep, because the hip is already bent before the knee moves.',
 x:'Letting the hips slide up off the seat, or stopping short of straight at the end of the rep.',
 v:'Hip flexed to roughly 90°, so the hamstring is already lengthened at the hip before the knee bends. That longer position is where the hamstring responds best, and it biases the long head. If the gym has both machines, default to this one.'};
MOVE['lying-leg-curl']={s:'Face down, hips flat against the pad, knees just past the edge of the bench. Ankle pad above the heels, not on the achilles.',
 d:'Curl the heels toward the glutes through the full range, brief pause, lower under control. 10 to 12 reps.',
 f:'Hamstrings at the knee end, hardest in the middle of the range.',
 x:'Lifting the hips off the pad to swing the stack. If the hips leave the bench, drop the weight.',
 v:'Hip extended, so the hamstring starts shorter than it does seated. It still trains knee flexion hard and it is a perfectly good exercise. It is just not the same one as the seated version, and it produces slightly less growth in the long head. Use it when the lying machine is what your gym has.'};
MOVE['standing-leg-curl']={s:'Standing at the machine, hips against the pad, one leg at a time, ankle pad above the heel.',
 d:'Curl one heel toward the glute, pause, lower slowly. 10 to 12 per side.',
 f:'One hamstring at a time. Easier to feel, harder to load.',
 x:'Leaning forward or arching the low back to finish the rep.',
 v:'Hip extended and single-leg by design. Lightest of the three and easiest to set up, but the hardest to progress. Use it only if the seated and lying machines are taken or missing.'};
MOVE['seated-leg-curl-single-leg']={s:'Seated leg curl set up as normal, one leg only, roughly a third of your two-leg load to start.',
 d:'Curl and then lower far more slowly than you curled. 8 to 10 per side. The slow return is the whole assignment.',
 f:'The eccentric. Lowering should be the hard part, not curling.',
 x:'Rushing the return, or letting the free leg brace against the machine.',
 v:'Seated puts the hip in flexion, which is the longer, better-growing position. If your gym only has a lying machine, use the lying single-leg version instead. Same slot, slightly different emphasis.'};
MOVE['lying-leg-curl-single-leg']={s:'Lying leg curl, one leg only, hips flat, roughly a third of your two-leg load to start.',
 d:'Curl and lower far more slowly than you curled. 8 to 10 per side.',
 f:'The eccentric on one hamstring at a time. Note which side is weaker.',
 x:'Twisting the hips toward the working side.',
 v:'Hip extended version. Fine if the lying machine is the one you have. The seated single-leg version gets more stretch.'};
MOVE['standing-calf-raise-machine']={s:'Shoulders under the pads, balls of the feet on the platform, heels hanging free, knees straight but not locked.',
 d:'Drop into a full stretch at the bottom, drive all the way up, pause at the top. 15 reps.',
 f:'The upper calf, the gastrocnemius. Both ends of the range matter equally.',
 x:'Short bouncy reps that never reach a stretch or a squeeze.',
 v:'Knees straight means the gastrocnemius does the work. That is the opposite of the seated version on Day C, which bends the knee and shifts the work to the soleus underneath. The week needs both.'};
MOVE['leg-press-calf-raise']={s:'In the leg press, balls of the feet on the bottom edge of the platform, legs nearly straight, safeties engaged.',
 d:'Push the platform away with the balls of the feet, full stretch at the bottom, pause at the top. 15 reps.',
 f:'Upper calf, same as the standing machine.',
 x:'Bending the knees to press, which turns it back into a leg press.',
 v:'Straight-leg loading, same target as the standing machine. Use it when there is no dedicated calf machine, or when standing loading bothers the left foot.'};
MOVE['smith-calf-raise']={s:'Bar across the upper back in the Smith, balls of the feet on a plate or block, knees straight.',
 d:'Full stretch at the bottom, drive up, pause. 15 reps.',
 f:'Upper calf.',
 x:'Letting the heels never drop below the block.',
 v:'Straight-leg version again. The fixed bar path is fine here since nothing is loaded through the shoulder joint the way a press is.'};
MOVE['lat-pulldown-neutral-grip']={s:'Neutral handle, palms facing each other, hands roughly shoulder width. Thighs locked under the pad, small lean back.',
 d:'Pull to the upper chest by driving the elbows down and back. Control the bar all the way up to a full stretch. 6 to 8 reps.',
 f:'Lats, with the shoulder blades sliding down before the arms bend.',
 x:'Rocking the torso to move the stack.',
 v:'Neutral and close puts the shoulder in its friendliest position and adds a little more biceps. Given the left shoulder, this is the default. Wide overhand demands more external rotation at the top, which is exactly the position you are avoiding elsewhere in this program.'};
MOVE['lat-pulldown-wide-overhand']={s:'Wide overhand grip, thumbs over, thighs locked under the pad, small lean back.',
 d:'Pull to the upper chest, elbows down and back, full controlled stretch at the top. 6 to 8 reps.',
 f:'More across the outer lat.',
 x:'Pulling behind the neck, ever. Also shrugging into the ears at the top.',
 v:'Wider and overhand emphasises lat width a bit more, but it forces more shoulder external rotation at the top. If the left shoulder is having a day, switch back to neutral close.',
 w:'Stop if the left shoulder pinches at the top of the rep. Switch grips rather than pushing through.'};

/* ---- five-day program additions ---- */
MOVE['db-hip-thrust']={s:'Upper back on a bench at about knee height, feet flat and hip width, DB or bar pad across the hips. Chin tucked, look forward.',
 d:'Drive through the heels and lift until the body is a straight line from knee to shoulder. Squeeze 1-2 seconds, lower under control. 10 reps.',
 f:'Glutes, hard, at the top.',
 x:'Hyperextending the low back at the top instead of finishing with the glutes. Ribs stay down, pelvis tucks slightly.',
 w:'Moderate reps and no breath holding. Heavy braced hip thrusts spike intra-abdominal pressure, which runs against the pelvic floor down-training trial.'};
MOVE['45-back-extension']={s:'Pads just below the hip crease so the hips can move freely. Arms crossed or hands at the temples.',
 d:'Lower with a slight round through the spine, then extend back up to a straight line and stop. Squeeze the glutes to finish. 12 reps.',
 f:'Hamstrings and glutes. If it is all low back, you are extending too far at the top.',
 x:'Hyperextending past neutral at the top. Straight line, then stop.',
 w:'Substitute a bench-supported single-leg glute bridge, 3×10/side, if there is no hyper bench.'};
MOVE['leg-press']={s:'Feet mid-platform, shoulder width, toes slightly out. Back and hips flat against the pad the whole set.',
 d:'Lower to moderate depth, press back up without locking the knees hard. 10 reps.',
 f:'Quads and glutes, with no load on the spine at all.',
 x:'Letting the hips curl off the seat at the bottom.',
 w:'Moderate depth only. Do not let the knees travel toward the chest. That end range is deep hip flexion, which is the left snapping hip.'};
MOVE['neutral-grip-pull-up-or-assisted']={s:'Neutral handles, palms facing. Assisted machine or band if needed.',
 d:'Start from a full hang with the shoulders active, pull the chest toward the handles, lower under control. 6 to 8 reps.',
 f:'Lats, with the shoulder blades depressing before the elbows bend.',
 x:'Kipping, or stopping halfway down. Full stretch every rep.',
 v:'Neutral grip, not wide pronated. Wide demands more shoulder external rotation at the top, which is the position being avoided everywhere else in this program.'};
MOVE['seated-cable-row-neutral-grip']={s:'Neutral handle, knees slightly bent, tall chest, no slouch.',
 d:'Pull to the belly, elbows past the ribs, squeeze the blades briefly. Control the return all the way to a full stretch. 10 reps.',
 f:'Mid back and lats.',
 x:'Rocking the torso back and forth to move the stack. The torso stays still.'};
MOVE['cable-chest-press']={s:'Cables at chest height, split stance, handles at the sides of the chest.',
 d:'Press forward and slightly together, control back to a stretch. 10 to 12 reps.',
 f:'Chest, with constant tension including at lockout, which a dumbbell does not give you.',
 x:'Letting the ribs flare and the low back arch as you press.'};
MOVE['cable-pull-through']={s:'Rope on the low pulley, facing away, rope between the legs, feet hip width.',
 d:'Hinge back letting the rope pull you into a stretch, then drive the hips forward to stand tall. Squeeze the glutes at the top. 12 reps.',
 f:'Glutes and hamstrings, with almost no load through the spine.',
 x:'Squatting it, or leaning back at the top. Finish standing straight, not arched.'};
MOVE['db-reverse-lunge']={s:'DBs at the sides, standing tall, feet hip width.',
 d:'Step straight back, lower the back knee toward the floor, then drive through the front heel to return. 8 per side.',
 f:'Front leg quad and glute.',
 x:'Short steps that push the front knee forward.',
 v:'Reverse rather than forward or a high step-up. Less deep hip flexion for the left hip and much less braking force through the left foot.'};
MOVE['cable-fly-high-to-low']={s:'Both cables high, split stance, slight forward lean, soft elbows fixed.',
 d:'Bring the hands down and together in front of the hips, squeeze, return slowly to a stretch behind the body line. 12 reps.',
 f:'Chest, hardest at the squeeze and again at the stretch.',
 x:'Bending and straightening the elbows, which turns it into a press.'};
MOVE['half-kneeling-single-arm-cable-pulldown']={s:'High pulley, half-kneeling, inside knee down, single handle overhead.',
 d:'Pull the elbow down toward the hip, ribs staying stacked over the pelvis. Control back to a full overhead stretch. 10 per side.',
 f:'Lat on the working side, and the core resisting the pull.',
 x:'Letting the ribs flare or the torso side-bend toward the cable.'};
MOVE['reverse-pec-deck']={s:'Chest on the pad, handles at shoulder height, elbows slightly bent and fixed.',
 d:'Open the arms out and back, squeeze the shoulder blades, return slowly. 15 reps, light.',
 f:'Rear delts and mid back.',
 x:'Bending the elbows to turn it into a row. Fixed elbow angle throughout.'};
MOVE['incline-db-curl']={s:'Bench at 45 to 60°, back flat against it, arms hanging straight down behind the torso.',
 d:'Curl without letting the elbows drift forward, lower all the way to a full stretch. 10 to 12 reps.',
 f:'A strong stretch on the biceps at the bottom. That stretched position is why this beats a standing curl.',
 x:'Letting the shoulders roll forward at the bottom, which kills the stretch.'};

/* ===================================================================
   movement guide sheet
   =================================================================== */
const sheet2=$('#sheet2'), scrim2=$('#scrim2'), m2body=$('#m2Body');
const reduceMo = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
function closeMove(){sheet2.classList.remove('on');scrim2.classList.remove('on')}
$('#m2Close').onclick=closeMove; scrim2.onclick=closeMove;
let openMoveArgs=null;
function openMove(key,name,meta,sub,ac,rest){
  openMoveArgs=[key,name,meta,sub,ac,rest];
  const M=MOVE[key]||null, acc=ac||'--orange', hex=getComputedStyle(document.documentElement).getPropertyValue(acc).trim()||'#FF9F0A';
  $('#m2Meta').textContent=meta||'Movement'; $('#m2Meta').style.color='var('+acc+')';
  $('#m2Title').textContent=tc(name); $('#m2Sub').textContent=sub||'';
  const media=(S.media||{})[key], note=(S.notes||{})[key]||'';
  const q=encodeURIComponent((VQ[key]||name)+' proper form');
  let h = media?`<div class="demo"><img src="${esc(media)}" alt="${esc(name)}" onerror="this.parentElement.style.display='none'"></div>`:'';
  h+=`<a class="watch" href="https://www.youtube.com/results?search_query=${q}" target="_blank" rel="noopener">
      <span class="wi yt">▶</span><span class="wt">Watch it<b>Video search for ${esc(VQ[key]||name)}</b></span><span class="wx">↗</span></a>`;
  h+=`<a class="watch" href="${REF[key]||'https://exrx.net/Lists/Directory'}" target="_blank" rel="noopener">
      <span class="wi rx">Rx</span><span class="wt">Look it up<b>${REF[key]?'ExRx reference page':'ExRx exercise directory'}</b></span><span class="wx">↗</span></a>`;
  if(rest)h+=`<div class="exbtns" style="margin:0 0 8px"><button class="pill go" data-timer="${rest}" data-for="rest">Rest ${fmt(rest)}</button>
    <span class="pill">Suggested rest between sets</span></div>`;
  if(M){
    const sec=(l,v,cls)=>v?`<div class="xp${cls||''}" style="--ac:var(${acc})"><span class="xl">${l}</span><p>${esc(v)}</p></div>`:'';
    h+=sec('Why this version',M.v)+sec('Set up',M.s)+sec('Do it',M.d)+sec('You should feel',M.f)+sec('Common fault',M.x)+sec('Watch for',M.w,' warn');
  } else {
    h+=`<div class="xp"><span class="xl">Note</span><p>No written guide for this one yet. Add what works for you below.</p></div>`;
  }
  h+=`<div class="subhead">Your notes</div>
    <textarea class="mnote" data-mnote="${esc(key)}" rows="3" placeholder="Cues that work, machine settings, seat height, which bell.">${esc(note)}</textarea>
    <div class="subhead">Your own clip</div>
    <input class="murl" data-mmedia="${esc(key)}" value="${esc(media||'')}" placeholder="Paste an image or GIF URL to replace the diagram">
    <div class="note" style="margin-top:6px">The diagram shows the movement path and direction, not exact form. Use Watch it for real video, or paste a clip you trust and it shows here instead.</div>`;
  m2body.innerHTML=h; m2body.scrollTop=0;
  sheet2.classList.add('on'); scrim2.classList.add('on');
}
m2body.addEventListener('click',e=>{
  const tm=e.target.closest('[data-timer]');
  if(tm){startTimer(tm,+tm.dataset.timer,tm.dataset.for);return}
});
m2body.addEventListener('input',e=>{
  const t=e.target;
  if(t.dataset.mnote){S.notes=S.notes||{};S.notes[t.dataset.mnote]=t.value;save();return}
  if(t.dataset.mmedia!==undefined&&t.hasAttribute('data-mmedia')){
    S.media=S.media||{};const k=t.dataset.mmedia;
    if(t.value.trim())S.media[k]=t.value.trim(); else delete S.media[k];
    save();return}
});
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&sheet2.classList.contains('on')){e.stopPropagation();closeMove()}},true);

/* ===================================================================
   init
   =================================================================== */
if(!store.get('base.v2')) save();
if(S.awake===true)requestWake();
document.addEventListener('click',()=>armAudio(),{once:true});
render();
</script>
